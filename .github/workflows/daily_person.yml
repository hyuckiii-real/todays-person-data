name: Daily Person Generator

on:
  schedule:
    # 매일 UTC 19:23 = 한국 시간(KST) 새벽 04:23 (자정~새벽 피크 트래픽 회피)
    - cron: '23 19 * * *'
  workflow_dispatch: # 수동 테스트 실행 버튼 활성화

permissions:
  contents: write

jobs:
  generate-person:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # 재시도 대기 시간을 고려해 25분으로 넉넉히 설정

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-genai pydantic

      - name: Run person generator script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_person.py

      - name: Commit and push generated JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add today.json archive.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update today's person ($(date -u +'%Y-%m-%d'))" && git push)
